[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "kts_shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
]

[tool.setuptools]
packages = [
    "shared",
    "shared.base",
    "shared.db",
    "shared.models",
    "shared.rabbit",
]
package-dir = {"shared" = ""}
